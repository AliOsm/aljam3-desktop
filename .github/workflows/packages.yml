name: Build packages

on:
  workflow_dispatch:
    inputs:
      test_pair:
        description: Build and verify the temporary 0.0.1 to 0.0.2 update
        type: boolean
        default: false
      publish:
        description: Publish verified packages to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      ALJAM3_TEST_PAIR: ${{ inputs.test_pair }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler: '4.0.16'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Configure the Windows linker and static C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$($env:VCToolsInstallDir)bin\Hostx64\x64\link.exe" >> $env:GITHUB_ENV
      - name: Prepare pinned native source
        run: ruby bin/setup --prepare
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/scarpe/native
          cache-on-failure: true
      - uses: actions/cache/restore@v4
        id: pdfium
        with:
          path: vendor/pdfium
          key: pdfium-${{ matrix.target }}-${{ hashFiles('bin/build-pdfium', 'packaging/pdfium/*.patch') }}
      - name: Set up pinned runtime and native libraries
        run: ruby bin/setup
      - uses: actions/cache/save@v4
        if: steps.pdfium.outputs.cache-hit != 'true'
        with:
          path: vendor/pdfium
          key: pdfium-${{ matrix.target }}-${{ hashFiles('bin/build-pdfium', 'packaging/pdfium/*.patch') }}
      - name: Application tests
        run: bundle exec rake test
      - name: Native layout, input, clipboard, and rendering tests
        run: cargo test --release --locked --manifest-path vendor/scarpe/native/Cargo.toml --lib --test clipboard --test text_input --test golden --test protocol --test a11y --test damage --test images
      - name: Native motion interactions and feedback
        run: |
          bundle exec ruby bin/verify-ui motion
          bundle exec ruby bin/verify-ui feedback
          bundle exec ruby bin/verify-ui interaction
          bundle exec ruby bin/verify-ui updates
      - name: Download and verify a real sample book
        run: bundle exec ruby bin/smoke
      - name: Keep the invisible Mac benchmark from background throttling
        if: runner.os == 'macOS'
        run: |
          clang -dynamiclib -framework Foundation packaging/macos_motion_activity.m -o "$RUNNER_TEMP/motion-activity.dylib"
          echo "ALJAM3_MOTION_ACTIVITY=$RUNNER_TEMP/motion-activity.dylib" >> "$GITHUB_ENV"
      - name: Build and verify release packages
        env:
          ALJAM3_VERIFY_TIMEOUT: '600'
        run: bundle exec ruby bin/build-release
      - name: Verify Windows installation and uninstallation
        if: runner.os == 'Windows'
        env:
          ALJAM3_VERIFY_TIMEOUT: '600'
        run: ruby bin/verify-installer
      - name: Verify Windows failed-install recovery
        if: runner.os == 'Windows'
        run: ruby bin/verify-update-helper
      - name: Sign test update metadata
        if: inputs.test_pair
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: ruby bin/sign-release dist 0.0.2
      - name: Verify actual update and relaunch from 0.0.1 to 0.0.2
        if: inputs.test_pair
        run: ruby bin/verify-update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aljam3-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256
            dist/update-*.json
            dist/verification/
            dist/installer-verification/
            dist/update-verification/
          if-no-files-found: warn
          retention-days: 1

  macos-26:
    name: Verify the same Mac package on macOS 26
    needs: package
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
      - uses: actions/download-artifact@v4
        with:
          name: Aljam3-macos-arm64
          path: input
      - name: Unpack the verified Apple silicon app
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          cd input
          shasum -a 256 -c *.zip.sha256
          ditto -x -k "$(ls Aljam3-*.zip | sort -V | tail -1)" ../dist
      - name: Prepare headless verification helpers
        run: ruby bin/setup --prepare
      - name: Exercise bundled PDF cancellation and rapid navigation
        env:
          ALJAM3_VERIFY_TIMEOUT: '240'
        run: ruby bin/verify-package --pdf-only
      - name: Verify Sparkle signatures and replacement on macOS 26
        run: ruby bin/verify-sparkle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aljam3-macos-26-pdf-verification
          path: |
            dist/verification/pdf/
            dist/update-verification/
          if-no-files-found: warn
          retention-days: 1

  windows-arm:
    name: Verify installer and update on Windows 11 ARM
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 35
    env:
      ALJAM3_VERIFY_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Aljam3-windows-x64
          path: dist
      - name: Bootstrap the bundled x64 runtime using the installer
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/*-setup.exe | Sort-Object Name | Select-Object -Last 1).FullName
          $expected = (Get-Content "$installer.sha256").Split(' ')[0]
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Installer checksum mismatch' }
          $installation = Join-Path $env:RUNNER_TEMP 'Aljam3'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installation`"") -PassThru -Wait
          if ($process.ExitCode) { throw 'Bootstrap installation failed' }
          $runtime = Join-Path $installation 'resources/ruby'
          $libraries = @('site_ruby/3.4.0', 'site_ruby/3.4.0/x64-mingw-ucrt', 'site_ruby', 'vendor_ruby/3.4.0', 'vendor_ruby/3.4.0/x64-mingw-ucrt', 'vendor_ruby', '3.4.0', '3.4.0/x64-mingw-ucrt')
          "RUBYLIB=$(($libraries | ForEach-Object { Join-Path $runtime "lib/ruby/$_" }) -join ';')" >> $env:GITHUB_ENV
          "ALJAM3_TEST_RUBY=$runtime/bin.real/ruby.exe" >> $env:GITHUB_ENV
      - name: Verify installed app and library preservation
        shell: pwsh
        run: |
          & $env:ALJAM3_TEST_RUBY bin/setup --prepare
          if ($LASTEXITCODE) { throw 'Helper preparation failed' }
          & $env:ALJAM3_TEST_RUBY bin/verify-installer
          if ($LASTEXITCODE) { throw 'Installer verification failed' }
      - name: Verify actual update through x64 emulation
        if: inputs.test_pair
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force '.cache/Installer Test - مكتبة الجامع/home/data' '.cache/smoke'
          & $env:ALJAM3_TEST_RUBY bin/verify-update
          if ($LASTEXITCODE) { throw 'Update verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aljam3-windows-arm64-verification
          path: |
            dist/installer-verification/
            dist/update-verification/
          retention-days: 1

  publish:
    if: inputs.publish
    needs: [package, macos-26, windows-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
      - uses: actions/download-artifact@v4
        with:
          pattern: Aljam3-*
          merge-multiple: true
          path: dist
      - name: Sign and publish verified releases
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          TEST_PAIR: ${{ inputs.test_pair }}
        run: |
          if [ "$TEST_PAIR" = true ]; then
            ruby bin/publish-release dist 0.0.1 0.0.2
          else
            ruby bin/publish-release dist
          fi
