name: Desktop test packages

on:
  workflow_dispatch:
    inputs:
      motion_baseline_run_id:
        description: Optional earlier package run for a motion comparison on the same runner
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler: '4.0.16'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Configure the Windows linker and static C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$($env:VCToolsInstallDir)bin\Hostx64\x64\link.exe" >> $env:GITHUB_ENV
      - name: Prepare pinned native source
        run: ruby bin/setup --prepare
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/scarpe/native
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: vendor/pdfium
          key: pdfium-${{ matrix.target }}-${{ hashFiles('bin/build-pdfium', 'packaging/pdfium/*.patch') }}
      - name: Set up pinned runtime and native libraries
        run: ruby bin/setup
      - name: Application tests
        run: bundle exec rake test
      - name: Native layout, input, clipboard, and rendering tests
        run: cargo test --release --locked --manifest-path vendor/scarpe/native/Cargo.toml --lib --test clipboard --test text_input --test golden --test protocol --test a11y --test damage
      - name: Native motion interactions and feedback
        run: |
          bundle exec ruby bin/verify-ui motion
          bundle exec ruby bin/verify-ui feedback
          bundle exec ruby bin/verify-ui interaction
      - name: Download and verify a real sample book
        run: bundle exec ruby bin/smoke
      - name: Assemble standalone application
        run: bundle exec ruby bin/package
      - name: Keep the invisible Mac benchmark from background throttling
        if: runner.os == 'macOS'
        run: |
          clang -dynamiclib -framework Foundation packaging/macos_motion_activity.m -o "$RUNNER_TEMP/motion-activity.dylib"
          echo "ALJAM3_MOTION_ACTIVITY=$RUNNER_TEMP/motion-activity.dylib" >> "$GITHUB_ENV"
      - name: Verify relocated app with its bundled Ruby
        env:
          # The relocated runtime renders the complete light/dark screenshot suite.
          ALJAM3_VERIFY_TIMEOUT: '240'
        run: ruby bin/verify-package
      - uses: actions/download-artifact@v4
        if: inputs.motion_baseline_run_id != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.motion_baseline_run_id }}
          name: Aljam3-${{ matrix.target }}
          path: .cache/motion-baseline-artifact
      - name: Compare motion with the previous packaged app
        if: inputs.motion_baseline_run_id != ''
        run: ruby bin/compare-motion
      - name: Archive verified app
        run: ruby bin/archive-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aljam3-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/verification/
          if-no-files-found: warn
          retention-days: 30

  macos-26:
    name: Verify the same Mac package on macOS 26
    needs: package
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
      - uses: actions/download-artifact@v4
        with:
          name: Aljam3-macos-arm64
          path: input
      - name: Unpack the verified Apple silicon app
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          cd input
          shasum -a 256 -c *.zip.sha256
          ditto -x -k Aljam3-*.zip ../dist
      - name: Prepare headless verification helpers
        run: ruby bin/setup --prepare
      - name: Exercise bundled PDF cancellation and rapid navigation
        env:
          ALJAM3_VERIFY_TIMEOUT: '240'
        run: ruby bin/verify-package --pdf-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aljam3-macos-26-pdf-verification
          path: dist/verification/pdf/
          if-no-files-found: warn
          retention-days: 30
