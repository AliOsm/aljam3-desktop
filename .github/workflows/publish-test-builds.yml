name: Publish verified test builds
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
      - uses: actions/download-artifact@v4
        with:
          name: Aljam3-macos-arm64
          path: dist
          run-id: 37367644522
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Aljam3-windows-x64
          path: dist
          run-id: 37367644522
          github-token: ${{ github.token }}
      - name: Publish the verified 0.0.1 and 0.0.2 pair
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: GITHUB_SHA=f87d541729b0c45ed8e75b966f02a0c85d54a11c ruby bin/publish-release dist 0.0.1 0.0.2
