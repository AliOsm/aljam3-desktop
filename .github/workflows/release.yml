name: Publish verified desktop packages

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful desktop package workflow run
        required: true
      tag:
        description: Existing draft prerelease tag
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download packages from a successful build
        run: |
          test "$(gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'Aljam3-*' --dir artifacts
      - name: Verify archive checksums
        run: |
          for target in macos-arm64 windows-x64; do
            (cd "artifacts/Aljam3-$target" && sha256sum --check *.sha256)
          done
      - name: Upload and publish the test release
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/Aljam3-*/*.zip artifacts/Aljam3-*/*.sha256
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
