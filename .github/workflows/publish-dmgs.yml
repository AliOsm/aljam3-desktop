name: Publish verified Mac DMGs
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful DMG verification run
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
      - name: Require completed platform verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RUN: ${{ inputs.run_id }}
        run: test "$(gh run view "$VERIFY_RUN" --json conclusion --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: Aljam3-macos-dmg
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Replace the pre-launch Mac ZIPs with signed DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: ruby bin/publish-dmg-test-pair
